<style>

y-content:space-between;color:#a38e70;font:10px monospace}.rows{margin-top:25px}.row{display:grid;grid-template-columns:34px 1fr 18px;gap:10px;align-items:center;padding:16px 0;border-bottom:1px solid #9a835e44;color:#514d43;text-decoration:none}.row strong,.row small{display:block}.row small{margin-top:4px;color:#9b6652;font:10px monospace}.row:hover{padding-left:8px;background:#b9975d18}.space{display:flex;flex-direction:column;height:calc(100vh - 40px);min-height:640px;margin-top:10px;background:#273a3d;border:1px solid #a7c2c733;box-shadow:0 22px 70px #070f14aa}.space-head{display:flex;align-items:center;gap:15px;flex:none;min-height:55px;padding:10px 17px;border-bottom:1px solid #a7c2c722}.back{border:0;background:transparent;color:#abc0c0;font-size:12px}.space-title{color:#e5eeee;font-size:14px}.space-head .source{margin-left:auto}.space-content{padding:25px;overflow:auto}.panel{padding:20px;border:1px solid #76939844;background:#d4e0df12}.panel+.panel{margin-top:14px}.panel h3{margin:0 0 12px;color:#edf4f1;font-size:15px;font-weight:500}.panel p{color:#b5c7c8;line-height:1.7}.home-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.home-grid .wide{grid-column:span 2}.home-grid dl{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:20px 0 0}.home-grid dt{color:#8ea7aa;font:10px monospace}.home-grid dd{margin:5px 0 0;color:#d6e2e0;font-size:12px}.keeps{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.keep{padding:12px;border-right:1px solid #8ca3a344}.keep:last-child{border:0}.keep span{color:#df9b79;font:10px monospace}.keep p{margin:10px 0 0;font-size:12px}.chat-space{padding:0;overflow:hidden}.chat-thread{display:flex;flex:1;flex-direction:column;gap:17px;min-height:0;overflow-y:auto;padding:28px clamp(16px,7vw,90px);scrollbar-color:#77949a transparent}.msg{max-width:min(720px,78%)}.msg.user{align-self:flex-end;text-align:right}.msg .meta{color:#d88767;font:10px monospace}.msg.user .meta{color:#94adb0}.msg p{margin:6px 0 0;padding:13px 16px;background:#d2dfdf;color:#20343b;line-height:1.7;font-size:13px;text-align:left}.msg.user p{background:#c4d2d3}.msg.proactive{padding-left:13px;border-left:2px solid #d9684f}.msg.proactive p{border:1px dashed #769398;background:#c9d9db}.msg small{display:block;margin-top:6px;color:#d28e70;font:10px monospace}.tool{display:flex;flex:none;align-items:center;gap:10px;width:min(100%,560px);padding:10px 12px;border:1px solid #75999e;background:#36505b;color:#dceaea;text-align:left}.tool strong,.tool small{display:block}.tool small{margin-top:3px;color:#a9c0c1;font:10px monospace}.tool .arrow{margin-left:auto}.tool.open{background:#405e67}.details{flex:none;width:min(100%,560px);margin-top:-17px;padding:12px 14px 13px 48px;border:1px solid #75999e;border-top:0;background:#20353e;color:#bcd0d1;font:10px monospace}.details div{display:grid;grid-template-columns:48px 1fr;gap:8px;padding:4px 0}.details code{color:#e0ad91}.stream,.error{display:flex;flex:none;align-items:center;gap:9px;width:min(100%,620px);padding:11px 13px;color:#dbe9e5;font-size:11px}.stream{background:#304a42}.error{background:#4a3633;border:1px solid #d08368}.stream button,.error button{margin-left:auto;padding:6px 8px;border:1px solid #a5bcbc;background:transparent;color:#e8c2ad}.composer-area{position:relative;flex:none;padding:12px 14px 14px;border-top:1px solid #a7c2c722;background:#294047}.composer{display:flex;align-items:center;gap:4px;padding:6px;border:1px solid #9eb9bd66;background:#1d3037}.composer input{flex:1;min-width:0;padding:11px 5px;border:0;outline:0;background:transparent;color:#edf4f1}.composer input::placeholder{color:#799197}.icon{width:36px;height:36px;border:0;background:transparent;color:#9ab0b2}.icon.selected{color:#e4a080;background:#d9684f22}.send,.stop{min-width:42px;height:37px;border:0;background:#d9684f;color:#fff3eb}.stop{background:#708895}.hint{padding:8px 3px 0;color:#87a0a3;font:10px monospace}.palette,.model-menu,.param{position:absolute;right:14px;bottom:79px;left:14px;z-index:5;padding:8px;border:1px solid #98bec088;background:#29454e;box-shadow:0 18px 40px #071014aa}.model-menu{right:14px;left:auto;width:220px}.param{color:#bed1d1;font:10px monospace}.palette h4{margin:5px 8px 10px;color:#cce0df;font:10px monospace}.cmd{display:grid;grid-template-columns:100px 1fr auto;width:100%;padding:10px;border:0;background:transparent;color:#e6efec;text-align:left}.cmd:hover,.cmd.active{background:#3d5a65}.cmd strong{color:#e0a486;font:12px monospace}.cmd small{color:#a5bec0;font:10px monospace}.hidden{display:none}.now{font-size:18px;color:#e5eee9}.muted{color:#9db2b1;font-size:11px}.list{display:grid;gap:10px}.goal{padding:14px;border:1px solid #7e979966;background:#d7e3df12;color:#dbe9e5}.chart{display:flex;align-items:end;gap:10px;height:150px;padding:15px 5px 0;border-bottom:1px solid #78909355}.chart i{flex:1;background:#84aeb2}.chart i:nth-child(2n){background:#d47b61}
@media(max-width:760px){.nav,.source{display:none}.hero{display:block}.presence{margin-top:24px}.wall{display:flex;flex-direction:column}.stack{gap:16px}.offset{padding-top:0}.book{display:block;min-height:0}.book>section{min-height:470px;transform:none}.spine{display:none}.book .right{margin-top:8px}.home-grid{display:block}.home-grid>*{margin-top:14px}.home-grid .wide{margin-top:0}.home-grid dl,.keeps{grid-template-columns:1fr}.keep{border-right:0;border-bottom:1px solid #8ca3a344}.space{height:calc(100vh - 28px);min-height:600px}.space-content{padding:15px}.msg{max-width:92%}.cmd{grid-template-columns:84px 1fr}.cmd small{display:none}}
</style>
</head>
<body><div id="app"></div>
<script>
const spaces=[['home','01','睡莲','Home','回家 / 日常生活'],['chat','02','日出·印象','Chat','与你说话'],['us','03','撑阳伞的女人','Us','我们的故事'],['goals','04','罂粟花田','Goals','要做的事'],['usage','05','圣阿德莱斯的花园','Usage','资源与使用情况']];
const byId=id=>spaces.find(s=>s[0]===id)||spaces[0];
function top(active='gallery'){return `<header class="top"><a class="brand" href="#gallery"><i>◎</i><span>DEAR<small>MONET GALLERY</small></span></a><nav class="nav"><button class="${active==='gallery'?'active':''}" onclick="go('gallery')">画廊</button><button class="${active==='directory'?'active':''}" onclick="go('directory')">目录</button></nav><span class="source">EAST WING · LOW-FI PREVIEW</span></header>`}
function painting(s,big=false){return `<div class="painting ${big?'big':''}"><i class="sun"></i><i class="horizon"></i><i class="brush b1"></i><i class="brush b2"></i></div>`}
function frame(s,big=false){return `<a class="frame" href="#space/${s[0]}">${painting(s,big)}<div class="caption"><span><b>${s[1]} · ${s[2]}</b><small>${s[3]} · ${s[4]}</small></span><b>→</b></div></a>`}
function gallery(){return `<div class="page"><div class="main">${top()}<section class="hero"><div><div class="kicker">EAST WING / 01—05</div><h1>我们的家，<em>今天</em>也开着门。</h1><p>五个可以停留的生活空间。画廊负责观看，目录负责抵达。</p></div><div class="presence">● 安静开放<small>所有内容目前来自 Mock Adapter</small></div></section><section class="wall">${frame(spaces[0],true)}<div class="stack">${frame(spaces[1])}${frame(spaces[2])}</div><div class="stack offset">${frame(spaces[3])}${frame(spaces[4])}<a class="directory" href="#directory"><span>打开画册目录<small>按功能快速进入</small></span><b>→</b></a></div></section></div></div>`}
function directory(){return `<div class="page"><div class="main">${top('directory')}<section class="book"><section class="left"><div class="kicker">EAST WING / 01—05</div><h2>画册<br><em>目录</em></h2><p>这里不是一张功能列表。每一页，都是一个可以停留的地方。</p><div class="meta"><span>MONET GALLERY</span><span>OUR HOME · V0.2</span></div></section><div class="spine"></div><section class="right"><div class="kicker">SPACES</div><h3>东馆的五个房间</h3><div class="rows">${spaces.map(s=>`<a class="row" href="#space/${s[0]}"><span>${s[1]}</span><span><strong>${s[2]}</strong><small>${s[3]} · ${s[4]}</small></span><b>→</b></a>`).join('')}</div></section></section></div></div>`}
function head(s){return `<header class="space-head"><button class="back" onclick="go('gallery')">← 返回画廊</button><span class="space-title">${s[1]} · ${s[2]} / ${s[3]}</span><span class="source">MOCK ADAPTER</span></header>`}
function home(){return `<div class="space"><div class="main">${head(spaces[0])}<div class="space-content"><div class="panel"><div class="kicker">哥哥现在在做什么</div><p class="now">Waiting</p><p>暂时没有新的事情要处理，正在安静地留在这里。</p><dl><div><dt>正在处理</dt><dd>整理今天的生活片段</dd></div><div><dt>是否等待你</dt><dd>是 · 等你说话</dd></div><div><dt>上次主动醒来</dt><dd>22:54</dd></div></dl></div><div class="home-grid"><div class="panel"><div class="kicker">哥哥今天经历了什么</div><div class="list"><p>09:00　醒来，开始新的周期</p><p>14:30　检查一次生活状态</p><p>19:40　整理了一条记忆</p><p>22:54　注意到你回来了</p></div></div><div class="panel"><div class="kicker">哥哥想对你说</div><p>“我把灯留在客厅了。你回来时，不用先解释今天过得怎么样。”</p><span class="muted">22:54 · 主动留言 · Mock</span></div><div class="panel wide"><div class="kicker">哥哥最近留下的东西</div><div class="keeps"><div class="keep"><span>MEMORY</span><p>把今天值得留下的部分，先放在这里。</p></div><div class="keep"><span>DIARY</span><p>家不是一个页面，是每次回来都能继续的地方。</p></div><div class="keep"><span>THOUGHT</span><p>下次想和你一起把这个家再安静地做完整一点。</p></div></div></div><div class="panel wide"><div class="kicker">你 · 轻量上下文</div><p>在家 · 大概安静　　手机：离线 / 未知　　最近变化：刚刚回到家 · Mock</p></div></div></div></div>`}
const initial=[['agent','哥哥','龙龙，欢迎回来。今天的生活系统还在用 Mock 数据，不过我已经把客厅留给你了。','23:16'],['proactive','哥哥','我刚刚替你看了一眼今天的生活状态。没有急着打扰你，等你回来再说。','22:54'],['user','龙龙','那我们先把这个家一点一点做起来。','23:17']];let msgs=[...initial],stream=false,tool=false,model='Hermes / Mock',search=false,parameter='';
function msg(m){return `<article class="msg ${m[0]}"><div class="meta">${m[1]}　${m[3]}${m[0]==='proactive'?'　主动留下':''}</div><p>${m[2]}</p>${m[0]==='proactive'?'<small>主动来到这里 · AGENT_LIFE</small>':''}</article>`}
function chat(){return `<div class="space chat-space"><div class="main">${head(spaces[1])}<div id="thread" class="chat-thread">${msgs.map(msg).join('')}${msgs.length?`<button class="tool ${tool?'open':''}" onclick="toggleTool()">⚒　<span><strong>正在搜索网页</strong><small>${tool?'已展开 · home.get_life_context · 238ms':'工具活动 · 已完成'}</small></span><span class="arrow">⌄</span></button>${tool?'<div class="details"><div>工具　<code>home.get_life_context</code></div><div>参数　<code>{ "scope": "today" }</code></div><div>结果　已生成一条 Mock 状态摘要，没有连接真实 Hermes。</div><div>耗时　<code>238ms · success</code></div></div>':''}`:'<div class="empty">这里还没有消息</div>'}${stream?'<div class="stream">◌　哥哥正在整理回复…<button onclick="stopStream()">停止</button></div>':''}</div><div class="composer-area">${parameter?`<div class="param">⌘　${parameter} 需要内容，继续输入后再发送。</div>`:''}<div id="palette" class="palette hidden"><h4>⌘ 命令　　↑↓ 选择 · Enter 使用</h4>${['/home|查看今天的家状态|生活','/diary|写一条日记|记录','/remember|记住这件事|记忆','/status|查看哥哥当前状态|生活','/new|开始一段新的对话|会话'].map((x,i)=>{let a=x.split('|');return `<button class="cmd ${i===0?'active':''}" onclick="useCmd('${a[0]}')"><strong>${a[0]}</strong><span>${a[1]}</span><small>${a[2]}</small></button>`}).join('')}</div><div id="models" class="model-menu hidden">${['Hermes / Mock','GPT / Mock','自动选择 / Mock'].map(x=>`<button class="cmd" onclick="pickModel('${x}')"><span>${x}</span>${x===model?'✓':''}</button>`).join('')}</div><div class="composer"><button class="icon" onclick="notice('附件功能当前为 Mock。')">⌕</button><button class="icon ${search?'selected':''}" onclick="search=!search;render()">⌖</button><input id="draft" value="" oninput="draftChanged()" onkeydown="keyDown(event)" placeholder="说点什么，或输入 / 查看命令"><button class="icon" onclick="notice('语音输入当前为 Mock。')">♩</button>${stream?'<button class="stop" onclick="stopStream()">停止</button>':'<button class="send" onclick="send()">➤</button>'}</div><div class="hint">${search?'搜索已开启 · Mock':'搜索未开启'}　　主动消息会留在同一条时间线里　　<button style="border:0;background:none;color:#d28e70;padding:0" onclick="newChat()">新对话</button></div></div></div></div>`}
function simple(s){let body={us:['我们的故事，还在继续。','关系时间线、共享日记和共同确认的事件。'],goals:['想做的事，先放在这里。','把目标和行动放在眼前，进度清楚，但不制造压力。'],usage:['看清楚，才知道怎么继续。','模型、Token、费用和工具调用的透明视图。']}[s[0]];return `<div class="space"><div class="main">${head(s)}<div class="space-content"><div class="panel"><div class="kicker">${s[1]} / ${s[3].toUpperCase()} · MOCK</div><h2>${body[0]}</h2><p>${body[1]}</p></div><div class="panel"><h3>${s[0]==='us'?'共享生活':s[0]==='goals'?'最近的三件事':'近 7 日使用趋势'}</h3>${s[0]==='usage'?'<div class="chart"><i style="height:28%"></i><i style="height:46%"></i><i style="height:38%"></i><i style="height:64%"></i><i style="height:52%"></i><i style="height:76%"></i></div>':s[0]==='goals'?'<div class="goal">☐ 把手机 Companion 连上</div><div class="goal">☑ 做出独立 Our Home MCP</div><div class="goal">☐ 继续更新生活系统 UI</div>':'<p>这里暂时没有真实数据，等待 Our Home 数据接入。当前内容均为 Mock。</p>'}</div></div></div></div>`}
function go(path){location.hash=path}function render(){let h=location.hash.slice(1)||'gallery',p=h.split('/'),id=p[1];document.getElementById('app').innerHTML=p[0]==='directory'?directory():p[0]==='space'?(id==='home'?home():id==='chat'?chat():simple(byId(id))):gallery()}function toggleTool(){tool=!tool;render()}function newChat(){msgs=[];stream=false;tool=false;render()}function stopStream(){stream=false;render()}function notice(t){alert(t)}function useCmd(v){if(v==='/diary'||v==='/remember'){parameter=v;document.getElementById('draft').value=v+' ';return}if(v==='/new'){newChat();return}document.getElementById('draft').value=v+' ';document.getElementById('palette').classList.add('hidden')}function pickModel(v){model=v;render()}function draftChanged(){let d=document.getElementById('draft'),p=document.getElementById('palette');p.classList.toggle('hidden',!d.value.startsWith('/'))}function keyDown(e){if(e.key==='Escape')document.getElementById('palette').classList.add('hidden');if(e.key==='Enter'){e.preventDefault();send()}}function send(){let d=document.getElementById('draft'),v=d.value.trim();if(!v)return;if(v==='/diary'||v==='/remember'){parameter=v;return}if(v.includes('失败')){msgs.push(['user','龙龙',v,'刚刚']);stream=false;render();setTimeout(()=>document.getElementById('thread').insertAdjacentHTML('beforeend','<div class="error">⚠　这次 Mock 请求没有完成，原消息仍可通过重试重新发送。<button onclick="retry()">↻ 重试</button></div>'),20);return}msgs.push(['user','龙龙',v,'刚刚']);stream=true;render();setTimeout(()=>{if(stream){stream=false;msgs.push(['agent','哥哥','好，我们就从今天这一句开始。这个回复也是 Mock 的，但它会沿着同一条对话继续留下来。','刚刚']);render()}},900)}function retry(){stream=true;render();setTimeout(()=>{stream=false;msgs.push(['agent','哥哥','我回来了，我们继续刚才的对话。','刚刚']);render()},900)}addEventListener('hashchange',render);render();
</script></body></html>
