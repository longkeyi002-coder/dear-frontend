<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>DEAR · 开屏</title>
<!-- 手写字体已本地化（素材/成品输出/fonts/），离线可用：英文 Dancing Script + 中文手写楷 Ma Shan Zheng -->
<link rel="stylesheet" href="素材/成品输出/fonts/fonts.css">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; }
  body {
    font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
    background: radial-gradient(ellipse at 50% 30%, #0b1226, #04060f 70%);
    color: #fff; height: 100dvh;
    -webkit-tap-highlight-color: transparent;
    overscroll-behavior: none;
  }
  :root {
    --font-hand: "Dancing Script", "Segoe Script", "Comic Sans MS", cursive;
    --font-hand-cn: "Ma Shan Zheng", "KaiTi", "STKaiti", "PingFang SC", cursive;
  }

  /* ========== 开屏层：9:16 竖版，宽屏居中成机身预览 ========== */
  #splash {
    position: fixed; top: 0; left: 50%; height: 100%; z-index: 10;
    width: min(100vw, 56.25vh);
    transform: translateX(-50%);
    overflow: hidden;
    transition: opacity .8s ease, transform .8s ease, visibility .8s;
  }
  #splash.out { opacity: 0; transition: opacity .9s ease; }
  @media (min-aspect-ratio: 3/4) {
    #splash { top: 2%; height: 96%; border-radius: 34px;
      box-shadow: 0 40px 120px rgba(0, 0, 0, .7), 0 0 0 1px rgba(255,255,255,.06); }
  }

  .bg {
    position: absolute; top: -1.5%; left: -1.5%; right: -1.5%; bottom: -1.5%;
    background: url("素材/成品输出/背景/bg_商用素材星海梦境_2.webp") center / cover no-repeat;
    animation: fadeIn 1.6s ease both, kenburns 26s ease-in-out infinite alternate;
  }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes kenburns {
    from { transform: scale(1.01) translate(-0.5%, 0.3%); }
    to   { transform: scale(1.05) translate(0.7%, -0.5%); }
  }
  .vignette {
    position: absolute; top: 0; left: 0; right: 0; bottom: 0;
    background:
      radial-gradient(ellipse at 50% 42%, transparent 26%, rgba(4, 8, 22, .82) 100%),
      linear-gradient(rgba(10, 16, 40, .30), rgba(10, 16, 40, .30));
  }
  /* 黑场收幕层（退场时用透明度过渡，不用 background 硬切） */
  .blackout {
    position: absolute; top: 0; left: 0; right: 0; bottom: 0; pointer-events: none;
    opacity: 0; background: radial-gradient(ellipse at 50% 42%, rgba(0, 0, 0, .55) 0%, #000 100%);
  }

  /* ===== 指针视差：多层不同步位移，营造空间纵深 ===== */
  .plx { position: absolute; top: 0; left: 0; right: 0; bottom: 0; pointer-events: none;
    transform: translate(calc(var(--px, 0) * var(--kx, -7px)), calc(var(--py, 0) * var(--ky, -5px)));
    transition: transform .5s cubic-bezier(.15, .7, .3, 1); will-change: transform; }
  .plx-strong { --kx: 12px; --ky: 8px; }
  .plx-soft   { --kx: 5px;  --ky: 3px; }

  /* 中央球体 */
  .stage {
    position: absolute; left: 50%; top: 44%;
    transform: translate(-50%, -50%);
    width: min(46vmin, 380px); aspect-ratio: 1;
    animation: rise 1.7s cubic-bezier(.16, .8, .3, 1) .35s both;
  }
  @keyframes rise {
    from { transform: translate(-50%, -40%) scale(.92); opacity: 0; }
    to   { transform: translate(-50%, -50%) scale(1);   opacity: 1; }
  }
  .halo {
    position: absolute; top: -18%; left: -18%; right: -18%; bottom: -18%;
    border-radius: 50%;
    background:
      radial-gradient(circle at 50% 50%, transparent 52.5%, rgba(160, 210, 255, .16) 57%, rgba(190, 160, 255, .10) 63%, transparent 72%),
      radial-gradient(circle, rgba(120, 180, 255, .30) 0%, rgba(120, 180, 255, .10) 45%, transparent 70%);
    animation: haloSpin 14s linear infinite, haloBreath 4.6s ease-in-out infinite;
  }
  @keyframes haloBreath { 0%, 100% { opacity: .85; } 50% { opacity: 1; } }
  @keyframes haloSpin {
    from { transform: rotate(0deg)  scale(1); }
    50%  { transform: rotate(180deg) scale(1.06); }
    to   { transform: rotate(360deg) scale(1); }
  }
  .orb {
    position: absolute; top: 0; left: 0; right: 0; bottom: 0;
    animation: floaty 4.6s ease-in-out infinite;
    filter: drop-shadow(0 24px 34px rgba(0, 10, 40, .55));
  }
  @keyframes floaty {
    0%, 100% { transform: translateY(0)     scale(.99); }
    50%      { transform: translateY(-12px) scale(1.025); }
  }
  /* ===== 球体：静止原图 + 流麻流沙层（不旋转贴图） ===== */
  .orb-inner { position: absolute; top: 0; left: 0; right: 0; bottom: 0;
    border-radius: 50%; overflow: hidden; transform-origin: 50% 58%;
    animation: orbTilt 9.5s ease-in-out infinite; }
  .orb-inner img { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: block; }
  .orb-sand { position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    mix-blend-mode: screen; pointer-events: none; }
  @keyframes orbTilt {   /* 3D 微倾：像水球在手里轻晃（1.05 底噪缩放防露边） */
    0%, 100% { transform: rotate(-1.6deg) rotateX(2.5deg) rotateY(-2deg) scale(1.05); }
    33%      { transform: rotate(1.2deg)  rotateX(-1.5deg) rotateY(2.2deg) scale(1.05); }
    66%      { transform: rotate(-0.8deg) rotateX(1.8deg) rotateY(1.2deg) scale(1.05); }
  }
  .drop { position: absolute; border-radius: 50%; mix-blend-mode: screen; opacity: 0;
    background: radial-gradient(circle at 35% 30%, rgba(255,255,255,.95), rgba(185,222,255,.3) 55%, transparent 75%);
    animation: dropRise var(--t, 8s) linear var(--dl, 0s) infinite; }
  @keyframes dropRise {
    0%   { transform: translateY(35%)  scale(.55); opacity: 0; }
    12%  { opacity: .9; }
    80%  { opacity: .55; }
    100% { transform: translateY(-150%) scale(1.15); opacity: 0; }
  }
  .shadow {
    position: absolute; left: 50%; bottom: -7%;
    width: 62%; height: 7%;
    transform: translateX(-50%);
    background: radial-gradient(ellipse, rgba(0, 5, 25, .5) 0%, transparent 70%);
    animation: shadowPulse 4.6s ease-in-out infinite;
  }
  @keyframes shadowPulse {
    0%, 100% { transform: translateX(-50%) scaleX(1);    opacity: .75; }
    50%      { transform: translateX(-50%) scaleX(.86);  opacity: .5; }
  }

  /* 标题 + 欢迎语 */
  .titles {
    position: absolute; left: 0; right: 0; top: 64%;
    text-align: center;
  }
  .titles h1 {
    font-family: var(--font-hand);
    font-size: clamp(44px, 9vmin, 84px);
    font-weight: 700; letter-spacing: .14em; text-indent: .14em;
    background: linear-gradient(120deg, #cfe4ff 20%, #ffffff 40%, #ffd9e8 60%, #cfe4ff 80%);
    background-size: 220% 100%;
    -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 2px 6px rgba(6, 12, 40, .9));
    animation: fadeUp 1.2s ease .5s both, shimmer 5s linear 1.7s infinite;
  }
  .titles p {
    margin-top: 16px;
    font-family: var(--font-hand-cn);
    font-size: clamp(17px, 2.6vmin, 23px);
    letter-spacing: .18em; text-indent: .18em;
    color: #f2f6ff;
    text-shadow: 0 1px 4px rgba(6, 12, 40, .95);
    transition: opacity .9s ease, transform .9s ease;
  }
  .titles p.greet-en {
    margin-top: 10px;
    font-family: var(--font-hand);
    font-style: italic;
    font-size: clamp(14px, 2vmin, 18px);
    letter-spacing: .06em; text-indent: .06em;
    color: #d9e6ff;
  }
  .titles p.swap { opacity: 0; transform: translateY(10px); }

  /* 进度条 + 进入按钮 */
  .loader {
    position: absolute; left: 50%; bottom: 5.5%;
    transform: translateX(-50%);
    width: min(42vw, 300px); text-align: center;
    animation: loaderIn 1s ease 1.5s both;
  }
  @keyframes loaderIn {
    from { opacity: 0; transform: translateX(-50%) translateY(18px); }
    to   { opacity: 1;   transform: translateX(-50%); }
  }
  .bar {
    height: 3px; border-radius: 3px;
    background: rgba(10, 16, 40, .45);
    box-shadow: 0 1px 6px rgba(4, 8, 22, .5);
    overflow: hidden;
  }
  .bar i {
    display: block; height: 100%; width: 0%;
    border-radius: 3px;
    background: linear-gradient(90deg, #8fd0ff, #ffd3e4);
    transition: width .35s ease;
  }
  .enter { margin-top: 22px; opacity: 0; pointer-events: none; transition: opacity .6s ease; }
  .enter.show { opacity: 1; pointer-events: auto; }
  .enter button {
    padding: 12px 44px;
    font-size: 15px; letter-spacing: .3em; text-indent: .3em;
    color: #10203c;
    background: linear-gradient(120deg, #cfe6ff, #ffdbe9);
    border: none; border-radius: 999px;
    cursor: pointer;
    animation: pulse 2.2s ease-in-out infinite;
  }
  .enter button:hover { filter: brightness(1.06); }
  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(255, 214, 232, .45); }
    50%      { box-shadow: 0 0 0 14px rgba(255, 214, 232, 0); }
  }

  /* 星光与点缀 */
  .spark { position: absolute; mix-blend-mode: screen;
    filter: drop-shadow(0 0 8px rgba(200, 225, 255, .35));
    animation: twinkle var(--d, 3s) ease-in-out var(--dl, 0s) infinite; opacity: 0; }
  @keyframes twinkle {
    0%, 100% { opacity: .12; transform: scale(.8)  rotate(0deg); }
    50%      { opacity: .8;  transform: scale(1.08) rotate(10deg); }
  }
  .drift { position: absolute; mix-blend-mode: screen; opacity: .42;
    filter: blur(.5px) drop-shadow(0 0 10px rgba(190, 215, 255, .3));
    animation: drift var(--d, 9s) ease-in-out infinite alternate; }
  @keyframes drift {
    from { transform: translate(0, 0); }
    to   { transform: translate(10px, -16px); }
  }
  .comet { position: absolute; top: 15%; left: -14%; width: 64px;
    mix-blend-mode: screen; opacity: 0;
    filter: drop-shadow(0 0 12px rgba(255, 250, 230, .85));
    animation: cometFly 13s linear 4s infinite; }
  @keyframes cometFly {
    0%   { transform: translate(0, 0) rotate(15deg);        opacity: 0; }
    3%   { opacity: .95; }
    16%  { transform: translate(85vw, 30vh) rotate(15deg);  opacity: 0; }
    100% { transform: translate(85vw, 30vh) rotate(15deg);  opacity: 0; }
  }

  @media (max-width: 640px) {
    .stage { width: 62vmin; }
    .titles { top: 62%; }
    .titles h1 { font-size: clamp(46px, 13vmin, 64px); }
    .titles p  { font-size: 19px; }
    .titles p.greet-en { font-size: 14px; }
    .loader { width: 62vw; bottom: calc(5.5% + env(safe-area-inset-bottom, 0px)); }
    .enter button { padding: 11px 38px; font-size: 14px; }
  }
  @media (min-aspect-ratio: 3/4) {   /* 宽屏：竖版舞台尺寸按舞台百分比 */
    .stage { width: min(68%, 340px); top: 42%; }
    .titles h1 { font-size: 46px; }
    .titles p  { font-size: 19px; }
    .titles p.greet-en { font-size: 15px; }
    .loader { width: 62%; }
    .spark, .drift { width: clamp(22px, 8%, 48px); }
  }
  @media (prefers-reduced-motion: reduce) {
    .bg, .halo, .orb, .orb-inner, .drop, .shadow, .spark, .drift, .comet, .stage, .loader, .enter button, .titles h1 { animation: none !important; }
    .plx { transform: none !important; }
  }
</style>
</head>
<body>

  <!-- 开屏层 -->
  <div id="splash">
    <div class="plx plx-bg"><div class="bg"></div></div>
    <img class="comet" src="素材/成品输出/组件PNG/star2_05.png" alt="">
    <div class="vignette"></div>
    <div class="blackout"></div>
    <div class="plx plx-strong">
      <div class="stage">
        <div class="halo"></div>
        <div class="orb">
          <div class="orb-inner">
            <img src="素材/成品输出/球体PNG/orb_01.png" alt="海浪球">
            <canvas class="orb-sand"></canvas>
            <i class="drop" style="--t:7s;  --dl:0s;   left:30%; top:55%; width:9px"></i>
            <i class="drop" style="--t:9s;  --dl:2.2s; left:55%; top:62%; width:7px"></i>
            <i class="drop" style="--t:8s;  --dl:4.1s; left:42%; top:70%; width:11px"></i>
            <i class="drop" style="--t:10s; --dl:1.3s; left:64%; top:50%; width:6px"></i>
            <i class="drop" style="--t:7.5s;--dl:5.4s; left:24%; top:66%; width:8px"></i>
            <i class="drop" style="--t:9.5s;--dl:3.2s; left:50%; top:44%; width:6px"></i>
          </div>
        </div>
        <div class="shadow"></div>
      </div>
    </div>

    <div class="plx plx-soft">
      <div class="titles">
        <h1>DEAR</h1>
        <p class="greet" id="greetZh"></p>
        <p class="greet-en" id="greetEn"></p>
      </div>
    </div>

    <!-- 星光点缀（位置/节奏用 CSS 变量控制） -->
    <img class="spark" style="--d:2.8s; --dl:.2s;  left:12%; top:24%; width:44px"  src="素材/成品输出/组件PNG/star2_02.png" alt="">
    <img class="spark" style="--d:3.6s; --dl:1.1s; left:82%; top:20%; width:56px"  src="素材/成品输出/组件PNG/star2_05.png" alt="">
    <img class="spark" style="--d:3.2s; --dl:.6s;  left:20%; top:66%; width:34px"  src="素材/成品输出/组件PNG/star2_12.png" alt="">
    <img class="spark" style="--d:4.2s; --dl:1.6s; left:86%; top:64%; width:38px"  src="素材/成品输出/组件PNG/star2_20.png" alt="">
    <img class="spark" style="--d:2.6s; --dl:1.9s; left:68%; top:12%; width:26px"  src="素材/成品输出/组件PNG/star2_16.png" alt="">
    <img class="spark" style="--d:3.9s; --dl:.9s;  left:8%;  top:48%; width:28px"  src="素材/成品输出/组件PNG/star2_23.png" alt="">

    <img class="drift" style="--d:10s; left:24%; top:56%; width:70px;" src="素材/成品输出/组件PNG/candy3.png" alt="">
    <img class="drift" style="--d:13s; left:70%; top:74%; width:58px;" src="素材/成品输出/组件PNG/candy4.png" alt="">
    <img class="drift" style="--d:16s; left:76%; top:40%; width:96px;" src="素材/成品输出/组件PNG/huanhai3_02.png" alt="">

    <div class="loader">
      <div class="bar"><i id="barFill"></i></div>
      <div class="enter" id="enter"><button id="enterBtn">进 入</button></div>
    </div>
  </div>

<script>
  const barFill = document.getElementById('barFill');
  const enter   = document.getElementById('enter');
  const splash  = document.getElementById('splash');

  /* ========== 欢迎语料库（纯前端字段，无需后端；日后接接口只需替换此对象） ========== */
  const WELCOME = {
    morning: [
      { zh: "早安，世界和你都值得被温柔以待。", en: "Good morning. The world and you both deserve tenderness." },
      { zh: "晨光正好，你也正好。", en: "The morning light is perfect, and so are you." },
      { zh: "每一个清晨，都是生活给你的礼物。", en: "Every morning is a gift from life." },
      { zh: "今天也要像阳光一样温暖哦。", en: "Be warm like sunshine today." },
      { zh: "✨ 早安，今天也要闪闪发光 ✨", en: "Shine bright today." }
    ],
    noon: [
      { zh: "午后时光，适合想你。", en: "Afternoon is perfect for thinking of you." },
      { zh: "阳光正好，微风不燥，你刚好。", en: "Soft sun, soft breeze, just you." },
      { zh: "趁阳光正好，去做想做的事吧。", en: "While the sun is shining, go do what you love." },
      { zh: "下午好，愿你被这个世界温柔相待。", en: "Good afternoon. May the world treat you gently." }
    ],
    evening: [
      { zh: "日落很美，你也很好。", en: "The sunset is beautiful, and so are you." },
      { zh: "晚风轻踩着云朵，月亮在贩售快乐。", en: "The breeze treads on clouds; the moon sells happiness." },
      { zh: "夕阳西下，我在想你。", en: "As the sun sets, I'm thinking of you." },
      { zh: "今晚的月色真美。", en: "The moonlight is beautiful tonight." },
      { zh: "人世间，最抚凡人心。", en: "Little joys soothe the ordinary heart." }
    ],
    night: [
      { zh: "夜深了，星星都困了，你也该睡了。", en: "It's late; even the stars are sleepy." },
      { zh: "夜色温柔，你也温柔。", en: "The night is gentle, and so are you." },
      { zh: "晚安，梦里见。", en: "Good night, see you in my dreams." },
      { zh: "🌙 晚安，月亮和我都陪着你 🌟", en: "The moon and I are both with you." }
    ],
    any: [
      { zh: "你来了。", en: "You're here." },
      { zh: "在。", en: "Present." },
      { zh: "好久不见。", en: "Long time no see." },
      { zh: "叮～你的小可爱已上线 💫", en: "Ding~ your cutie is online." },
      { zh: "你来啦！今天也要开开心心的哦", en: "You came! Have a happy day." },
      { zh: "今天也会是很好的一天，因为你在。", en: "Today will be wonderful, because you're here." },
      { zh: "慢慢来，一切都是最好的安排。", en: "Take your time. Everything is meant to be." },
      { zh: "你值得世间一切美好。", en: "You deserve all the beautiful things." },
      { zh: "所有的遇见，都是久别重逢。", en: "Every meeting is a reunion." },
      { zh: "你是人间四月天。", en: "You are the April of this world." }
    ]
  };

  /* 按时段选库 + 随机（避免连着重样），开屏期间每 7s 自然淡换 */
  (function welcome() {
    const zh = document.getElementById('greetZh');
    const en = document.getElementById('greetEn');
    if (!zh) return;
    const h = new Date().getHours();
    const period = h >= 5 && h < 11 ? 'morning'
                 : h >= 11 && h < 15 ? 'noon'
                 : h >= 15 && h < 22 ? 'evening' : 'night';
    const pool = WELCOME[period].concat(WELCOME.any);
    let last = -1;
    function pick() {
      let i;
      do { i = (Math.random() * pool.length) | 0; } while (i === last && pool.length > 1);
      last = i;
      return pool[i];
    }
    function apply(item) {
      zh.textContent = item.zh;
      en.textContent = item.en || "";
    }
    function swap() {
      zh.classList.add('swap'); en.classList.add('swap');
      setTimeout(() => { apply(pick()); zh.classList.remove('swap'); en.classList.remove('swap'); }, 950);
    }
    apply(pick());
    setInterval(swap, 7000);
  })();

  /* ===== 进度条：资源加载 + 最短展示 2.5s ===== */
  let progress = 0, loaded = false;
  window.addEventListener('load', () => loaded = true);
  const tick = setInterval(() => {
    progress = Math.min(progress + Math.random() * 14 + 6, loaded ? 100 : 88);
    barFill.style.width = progress + '%';
    if (progress >= 100) { clearInterval(tick); enter.classList.add('show'); }
  }, 200);

  /* ===== 点击进入：装饰退场 → 球体变黑放大吞没画面 → 黑场收拢移除 ===== */
  function leave() {
    if (splash.classList.contains('leave')) return;
    splash.classList.add('leave');
    setTimeout(() => splash.classList.add('out'), 3100);
    setTimeout(() => {
      try { if (window.parent && window.parent !== window) window.parent.postMessage('dear-splash-exit', '*'); } catch (e) {}
      splash.remove();
    }, 4200);
  }
  document.getElementById('enterBtn').addEventListener('click', leave);
  splash.addEventListener('click', (e) => { if (e.target.id !== 'enterBtn') leave(); });

  /* ===== 指针视差：三层异速位移，让画面"活"起来 ===== */
  (function parallax() {
    if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    const root = document.getElementById('splash');
    let tx = 0, ty = 0, cx = 0, cy = 0, raf = null;
    addEventListener('pointermove', (e) => {
      tx = (e.clientX / innerWidth - 0.5) * 2;
      ty = (e.clientY / innerHeight - 0.5) * 2;
      if (!raf) loop();
    });
    function loop() {
      cx += (tx - cx) * 0.06; cy += (ty - cy) * 0.06;
      root.style.setProperty('--px', cx.toFixed(3));
      root.style.setProperty('--py', cy.toFixed(3));
      raf = (Math.abs(tx - cx) + Math.abs(ty - cy) > 0.002)
        ? requestAnimationFrame(loop) : null;
    }
  })();

  /* ===== 流麻流沙 v3：粒子场 = 画中浪花的真实形状（从浪花层 alpha 采样），
     运动 = 水体晃动(摆) + 沿切向闪游 + 掠面流光，全部粒子都在球内 ===== */
  (function sandOrb() {
    if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    const cv = document.querySelector('.orb-sand');
    if (!cv) return;
    const ctx = cv.getContext('2d');
    const DPR = Math.min(devicePixelRatio || 1, 2.5);
    const rng = Math.random;
    let S = 0;
    function resize() {
      S = cv.clientWidth; if (!S) return;
      cv.width = S * DPR; cv.height = S * DPR;
      ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    }
    resize(); addEventListener('resize', resize);

    // 从浪花层图片的 alpha 通道采样粒子出生点 → 粒子场 = 画中浪花的形状
    const grains = [];
    let built = false;
    function sample(img, aThresh, count, smin, smax, alphaMul, tint) {
      const c = document.createElement('canvas');
      c.width = img.naturalWidth; c.height = img.naturalHeight;
      const x = c.getContext('2d');
      x.drawImage(img, 0, 0);
      const d = x.getImageData(0, 0, c.width, c.height).data;
      const pts = [];
      for (let i = 3; i < d.length; i += 12) if (d[i] > aThresh) pts.push(i);
      if (!pts.length) return;
      for (let i = 0; i < count; i++) {
        const idx = pts[(rng() * pts.length) | 0];
        const px = ((idx / 4) % c.width) / c.width;
        const py = (((idx / 4) / c.width) | 0) / c.height;
        const r = rng();
        grains.push({
          hx: px, hy: py,
          s: smin + rng() * (smax - smin),
          c: tint || (r < 0.1 ? '255,218,235' : r < 0.18 ? '255,238,200' : '238,248,255'),
          a: alphaMul * (0.55 + rng() * 0.45),
          ph: rng() * Math.PI * 2, tws: 1.5 + rng() * 3.5,
          glint: rng() < 0.07,
          orbR: 2.5 + rng() * 6,          // 游动轨道半径（可见的移动）
          orbW: (0.25 + rng() * 0.55) * (rng() < 0.5 ? 1 : -1),  // 角速度（有正有反）
          orbT: rng() * Math.PI * 2,      // 轨道起始角
        });
      }
    }
    function build() {
      if (built) return; built = true;
      sample(foamImg, 110, 900, 0.7, 1.8, 1.0);                // 主浪：密集白浪
      sample(foam2Img, 55, 380, 1.0, 2.3, 0.55, '200,226,255'); // 雾层：柔和蓝雾
    }
    const foamImg = new Image();  foamImg.src  = "素材/成品输出/球体PNG/orb_01_foam.png";
    const foam2Img = new Image(); foam2Img.src = "素材/成品输出/球体PNG/orb_01_foam2.png";
    foamImg.onload = foam2Img.onload = () => { if (foamImg.complete && foam2Img.complete) build(); };
    foamImg.onerror = foam2Img.onerror = build;

    // 球内光尘
    const M = 14;
    const motes = [];
    function spawnMote() {
      const a = rng() * Math.PI * 2, rr = Math.sqrt(rng()) * (S / 2 - 18) * 0.85;
      return {
        x: S / 2 + Math.cos(a) * rr,
        y: S / 2 + Math.abs(Math.sin(a)) * rr * 0.7 + S * 0.2,
        vy: -(6 + rng() * 12), sway: rng() * Math.PI * 2,
        s: 1.6 + rng() * 2.6, tw: rng() * Math.PI * 2,
        c: rng() < 0.25 ? '255,218,235' : '205,232,255',
      };
    }

    let last = performance.now();
    function frame(now) {
      const dt = Math.min((now - last) / 1000, 0.05); last = now;
      if (!S && cv.clientWidth) resize();
      if (S) {
        ctx.clearRect(0, 0, S, S);
        const ts = now / 1000;
        const R = S / 2;
        while (motes.length < M) motes.push(spawnMote());
        // --- 球内光尘 ---
        for (const m of motes) {
          m.y += m.vy * dt;
          m.x += Math.sin(ts * 0.7 + m.sway) * 6 * dt;
          const dx = m.x - R, dy = m.y - R;
          if (Math.hypot(dx, dy) > R - 10) {
            const a2 = rng() * Math.PI * 2, rr2 = Math.sqrt(rng()) * (R - 18) * 0.8;
            m.x = R + Math.cos(a2) * rr2; m.y = R + Math.abs(Math.sin(a2)) * rr2 + R * 0.3;
          }
          const al = 0.26 + 0.28 * (0.5 + 0.5 * Math.sin(m.tw + ts * 2));
          const gr = ctx.createRadialGradient(m.x, m.y, 0, m.x, m.y, m.s * 3);
          gr.addColorStop(0, `rgba(${m.c},${al})`);
          gr.addColorStop(1, `rgba(${m.c},0)`);
          ctx.fillStyle = gr;
          ctx.beginPath(); ctx.arc(m.x, m.y, m.s * 3, 0, Math.PI * 2); ctx.fill();
        }
        // --- 浪花形状粒子场：整体水体摆动 + 掠面流光 ---
        if (built) {
          const ang = Math.sin(ts * 0.32) * 0.055 + Math.sin(ts * 0.13) * 0.02;  // 水体摆动（双频）
          const ca = Math.cos(ang), sa = Math.sin(ang);
          for (const p of grains) {
            const bx = p.hx - 0.5, by = p.hy - 0.5;
            let x = (bx * ca - by * sa + 0.5) * S;
            let y = (bx * sa + by * ca + 0.5) * S;
            p.orbT += p.orbW * dt;                       // 绕浪花位置的可见游动
            x += Math.cos(p.orbT) * p.orbR + Math.sin(ts * 1.15 + p.ph) * 1.2;
            y += Math.sin(p.orbT) * p.orbR * 0.65 + Math.cos(ts * 0.9 + p.ph * 1.3) * 1.0;
            const sweep = 0.5 + 0.5 * Math.sin(ts * 0.85 - p.hy * 5 + p.ph * 0.25);  // 流光沿浪面扫过
            const al = p.a * (0.55 + 0.45 * sweep) * (0.6 + 0.4 * Math.sin(p.ph + ts * p.tws));
            const r = p.glint ? p.s * 1.8 : p.s;
            ctx.fillStyle = `rgba(${p.c},${al})`;
            ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
            if (p.glint) {
              ctx.strokeStyle = `rgba(255,255,255,${al * 0.5})`;
              ctx.lineWidth = 0.6;
              ctx.beginPath();
              ctx.moveTo(x - r * 2.2, y); ctx.lineTo(x + r * 2.2, y);
              ctx.moveTo(x, y - r * 2.2); ctx.lineTo(x, y + r * 2.2);
              ctx.stroke();
            }
          }
        }
      }
      if (document.body.contains(cv)) requestAnimationFrame(frame);
    }
    frame(performance.now());   // 先同步绘制首帧，防止 rAF 被节流时画布空白
  })();

  /* ===== 退场样式（.leave / .out 的样式定义在 CSS 中） ===== */
</script>
</body>
</html>
