    function directory(){return `<div class="page oh-directory-v06"><div class="main">${header("directory")}<section class="catalogue-stage"><div class="book-shell"><div class="book-cover"><span>DEAR</span><small>MONET GALLERY<br>CATALOGUE · EAST WING</small></div><div class="book-spread"><div class="book-page book-left"><div class="page-kicker">EAST WING / 01—05</div><div class="page-title">画册</div><p>这里不是一张功能列表。<br>每一页，都是一个可以停留的地方。</p><span class="page-number">01</span></div><div class="book-spine"></div><div class="book-page book-right"><div class="page-kicker">OUR HOME · A DIRECTORY</div><div class="book-rows">${spaces.map(s=>`<a class="row book-row" href="#space/${s.id}"><span class="num">${s.n}</span><span class="icon" style="--accent:${s.a}">○</span><span class="rowcopy"><strong>${s.title}</strong><small>${s.en} · ${s.sub}</small></span><b>→</b></a>`).join("")}</div><span class="page-number">02</span></div></div></div></section></div></div>`}
    function homeSpace(){return `<div class="page oh-space-home-v01"><div class="main">${header()}<div class="space-top"><a class="back" href="#gallery">← 返回 Gallery</a></div><main class="home-v01-main"><section class="home-v01-welcome"><div><div class="kicker">01 / HOME · MOCK</div><h1>欢迎回来。</h1><p>晚上 23:20 · 家里很安静</p></div><div class="home-v01-presence"><span>WAITING</span><strong>我在等你回来。</strong><small>上次主动醒来 · 22:54</small></div></section><section class="home-v01-layout"><article class="home-v01-panel home-v01-now"><div class="home-v01-label">哥哥现在在做什么 <small>AGENT_LIFE</small></div><strong class="home-v01-state">Waiting</strong><p>正在安静地留在这里，没有新的事情要处理。</p><dl><div><dt>正在处理</dt><dd>整理今天的生活片段</dd></div><div><dt>是否等待你</dt><dd>是 · 等你说话</dd></div></dl></article><article class="home-v01-panel home-v01-timeline"><div class="home-v01-label">哥哥今天经历了什么 <small>LIFE · MOCK</small></div><div class="home-v01-moments"><div><time>09:00</time><span><strong>醒来，开始新的周期</strong><small>我把今天重新整理了一遍。</small></span></div><div><time>14:30</time><span><strong>检查一次生活状态</strong><small>确认家里的灯还亮着。</small></span></div><div><time>19:40</time><span><strong>整理了一条记忆</strong><small>把值得留下的部分放好。</small></span></div><div><time>22:54</time><span><strong>注意到你回来了</strong><small>于是把客厅留给你。</small></span></div></div></article><article class="home-v01-panel home-v01-message"><div class="home-v01-label">哥哥想对你说 <small>AGENT_LIFE</small></div><blockquote>“我把灯留在客厅了。你回来时，不用先解释今天过得怎么样。”</blockquote><small>22:54 · 主动留言 · Mock</small><a href="#space/chat">去 Chat 找我 →</a></article><article class="home-v01-panel home-v01-keeps-panel"><div class="home-v01-label">哥哥最近留下的东西 <small>3 ITEMS · MOCK</small></div><div class="home-v01-keeps"><div><b>MEMORY</b><span>把今天值得留下的部分，先放在这里。</span><small>刚刚整理</small></div><div><b>DIARY</b><span>家不是一个页面，是每次回来都能继续的地方。</span><small>今天</small></div><div><b>THOUGHT</b><span>下次想和你一起把这个家再安静地做完整一点。</span><small>待继续</small></div></div></article><article class="home-v01-panel home-v01-you"><div class="home-v01-label">你 <small>轻量上下文</small></div><strong>在家 · 大概安静</strong><span>手机：离线 / 未知</span><span>最近变化：刚刚回到家</span><small>只保留会影响哥哥判断的部分。</small></article></section></main></div></div>`}
    function space(id){if(id==='home')return homeSpace();const s=spaces.find(x=>x.id===id);if(!s)return gallery();let content={home:['欢迎回家，龙龙。','这里会放时间、手机状态、天气、留言和最近活动。','还没有手机上报。连接 companion 后，这里会出现真实设备状态。'],chat:['日出以后，继续聊天。','Mock 聊天空间：主动留言会和普通对话放在同一条时间线。','哥哥：龙龙，欢迎回来。今天的生活系统还在用 Mock 数据，不过我已经把客厅留给你了。'],us:['我们的故事，还在继续。','关系时间线、日记、纪念日与共同确认的事件。','这里暂时没有真实关系事件，等待 Our Home 数据接入。'],goals:['想做的事，先放在这里。','把目标和行动放在眼前，不制造压力。','☐ 把手机 Companion 连上\n☑ 做出独立 Our Home MCP\n☐ 继续更新生活系统 UI'],usage:['看清楚，才知道怎么继续。','模型、Token、费用和工具调用的资源空间。','总 Token（示例）：24.8k\n工具调用（示例）：18\n费用：暂不可获取']}[id];return `<div class="page"><div class="main">${header()}<div class="space-top"><button class="back" onclick="location.hash='gallery'">← 返回画廊</button></div><main class="space-main"><div class="kicker">${s.n} / ${s.en.toUpperCase()} · MOCK</div><h1>${content[0]}</h1><p>${s.desc}</p><div class="panel"><h2>${content[1]}</h2><p class="empty">${content[2].replace(/\n/g,'<br>')}</p>${id==='chat'?'<div class="composer"><input id="draft" placeholder="说点什么，或输入 / 查看命令" /><button onclick="send()">发送</button></div>':''}</div></main></div></div>`}
    function send(){const input=document.getElementById('draft');if(input&&input.value.trim()){input.value='';alert('Mock 消息已加入体验状态。')}}
    function bindGalleryInteractions(){
      const wall=document.querySelector(".oh-wall-v06 .wall");
      if(!wall)return;
      const pieces=[...wall.querySelectorAll(".gallery-piece")];
      const reset=()=>{wall.style.setProperty("--spot-opacity","0");pieces.forEach(p=>p.style.setProperty("--focus","0"))};
      wall.addEventListener("pointermove",event=>{
        const wallRect=wall.getBoundingClientRect();
        wall.style.setProperty("--spot-x",`${event.clientX-wallRect.left}px`);
        wall.style.setProperty("--spot-y",`${event.clientY-wallRect.top}px`);
        wall.style.setProperty("--spot-opacity","1");
        pieces.forEach(piece=>{
          const r=piece.getBoundingClientRect();
          const cx=r.left+r.width/2,cy=r.top+r.height/2;
          const distance=Math.hypot(event.clientX-cx,event.clientY-cy);
          piece.style.setProperty("--focus",Math.max(0,Math.min(1,1-distance/360)).toFixed(3));
        });
      });
      wall.addEventListener("pointerleave",reset);
      pieces.forEach(piece=>{
        const link=piece.querySelector(".frame");
        link.addEventListener("click",event=>{
          event.preventDefault();
          const target=link.getAttribute("href");
          wall.classList.add("approach");
          setTimeout(()=>{location.hash=target.slice(1)},620);
        });
      });
    }
    function bindDirectoryInteractions(){
      const stage=document.querySelector(".catalogue-stage");
      if(!stage)return;
      requestAnimationFrame(()=>stage.classList.add("is-open"));
      document.querySelectorAll(".book-row").forEach(row=>row.addEventListener("click",event=>{
        event.preventDefault();
        if(stage.classList.contains("turning"))return;
        stage.classList.add("turning");
        const target=row.getAttribute("href");
        setTimeout(()=>{location.hash=target.slice(1)},620);
      }));
    }
    function render(){
      const hash=location.hash.slice(1)||"gallery";
      const [kind,id]=hash.split("/");
      document.getElementById("app").innerHTML=kind==="directory"?directory():kind==="space"?space(id):gallery();
      if(kind==="directory")bindDirectoryInteractions();
      else if(kind!=="space")bindGalleryInteractions();
    }
addEventListener('hashchange',render);render();
  </script>
