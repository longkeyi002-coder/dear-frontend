<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Dear · Monet Gallery Preview</title>
  <style>
    :root{font-family:system-ui,-apple-system,"Segoe UI","Noto Sans SC",sans-serif;color:#233d3a;background:#e9f1e9}*{box-sizing:border-box}body{margin:0;min-width:320px;background:linear-gradient(135deg,#e9f1e9,#dbe9e1);overflow-x:hidden}button,a{font:inherit;color:inherit}a{text-decoration:none}.page{min-height:100vh;padding:22px clamp(18px,5vw,68px)}header{max-width:1260px;margin:auto;display:flex;align-items:center;gap:28px;min-height:48px}.brand{display:flex;align-items:center;gap:10px;min-width:190px;font-weight:700;letter-spacing:.14em}.brand i{display:grid;place-items:center;width:31px;height:31px;border:1px solid;border-radius:50%;font-style:normal;font-size:22px}.brand small{display:block;margin-top:3px;color:#71847f;font:10px monospace;font-weight:400}.nav{display:flex;gap:22px;color:#6f8580;font-size:13px}.nav a.active{color:#233d3a;border-bottom:2px solid #b75e4c;padding-bottom:8px}.status{margin-left:auto;color:#6f8580;font-size:12px}.pill{display:inline-block;margin-left:8px;padding:4px 7px;border:1px solid #8ea39c;border-radius:4px;font:10px monospace}.main{max-width:1260px;margin:auto}.intro{display:flex;justify-content:space-between;align-items:end;gap:30px;padding:clamp(60px,10vw,130px) 0 45px}.kicker{color:#a85d4c;font:11px monospace;letter-spacing:.12em}.intro h1{max-width:700px;margin:14px 0 0;font-size:clamp(34px,5vw,68px);font-weight:500;letter-spacing:-.06em}.intro h1 em{color:#ad6251;font-style:normal}.intro p{color:#6f8580;font-size:15px}.note{max-width:260px;padding:15px 0;border-bottom:1px solid #b9c9c2;color:#6f8580;font-size:12px}.note small{display:block;margin-top:7px;color:#9aa9a4;font-size:10px}.wall{display:grid;grid-template-columns:1.25fr .92fr .92fr;gap:22px}.stack{display:grid;gap:22px}.offset{padding-top:58px}.frame{padding:14px;background:#d2a77b;box-shadow:7px 9px 0 #324d411f,0 22px 60px #2e534915;transition:.2s}.frame:hover{transform:translateY(-5px) rotate(-.3deg)}.inner{padding:8px;background:#f2e4c9}.painting{position:relative;min-height:150px;overflow:hidden;background:#aec8c3}.large{min-height:390px}.painting:after{content:"";position:absolute;inset:0;opacity:.11;background:repeating-linear-gradient(115deg,transparent 0 11px,#fff6 12px 13px,transparent 14px 27px)}.painting img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.art-credit{position:absolute;right:10px;bottom:8px;z-index:1;padding:3px 5px;background:#17130daa;color:#fff9ec;font:8px monospace;letter-spacing:.04em}.caption{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:15px 2px 2px;color:#fff9ec}.label{display:flex;align-items:center;gap:9px}.num{font:11px monospace}.icon{display:grid;place-items:center;width:28px;height:28px;border:1px solid var(--accent);border-radius:50%;color:var(--accent)}.label strong,.label small{display:block}.label strong{font-size:14px}.label small{margin-top:3px;color:#fff9ecb8;font-size:10px}.directory{display:flex;align-items:center;gap:12px;padding:18px;border:1px dashed #233d3a55;color:#233d3a}.directory small{display:block;color:#6f8580;font-size:11px}.directory b{margin-left:auto;color:#a85d4c}.footer{max-width:1260px;margin:45px auto 0;color:#6f8580;font:10px monospace;letter-spacing:.08em}.screen{display:none}.space-top{max-width:1260px;margin:auto;padding:20px 0;border-bottom:1px solid #b9c9c2}.back{border:0;background:none;color:#6f8580;cursor:pointer}.space-main{max-width:900px;margin:50px auto}.space-main h1{font-size:clamp(34px,6vw,65px);font-weight:500;letter-spacing:-.06em}.space-main>p{color:#6f8580;line-height:1.8}.panel{margin-top:22px;padding:24px;border:1px solid #233d3a26;background:#ffffff4d}.panel h2{font-size:18px;font-weight:500}.panel p{line-height:1.8}.chat{min-height:230px}.composer{display:flex;gap:8px;margin-top:20px}.composer input{flex:1;min-width:0;padding:13px;border:1px solid #233d3a55;background:#ffffff80}.composer button{padding:0 16px;border:0;background:#b75e4c;color:#fff;cursor:pointer}.directory-list{max-width:900px;margin:50px auto}.row{display:flex;align-items:center;gap:17px;padding:22px 8px;border-bottom:1px solid #b9c9c2}.row .num{width:28px;color:#6f8580}.row .rowcopy{flex:1}.rowcopy strong,.rowcopy small{display:block}.rowcopy small{margin-top:6px;color:#6f8580;font-size:12px}.row:hover{background:#ffffff38}.empty{color:#6f8580;line-height:1.8}@media(max-width:760px){.page{padding:14px 18px}.nav,.status{display:none}.intro{display:block;padding-top:65px}.note{margin-top:28px}.wall{display:flex;flex-direction:column;gap:16px}.stack{gap:16px}.offset{padding-top:0}.large{min-height:300px}.footer{line-height:1.8}.row{gap:10px}.rowcopy strong{font-size:15px}.rowcopy small{display:none}}
    .oh-wall-v02{background:#b8b1a1}.oh-wall-v02 .wall{position:relative;padding:64px 7%;background:#c8c0af;border:1px solid #473d2f55;box-shadow:inset 0 0 70px #4e423124,0 24px 55px #37312633}.oh-wall-v02 .wall:before{content:'EAST WING';position:absolute;top:18px;left:26px;color:#473d2f70;font:10px monospace;letter-spacing:.18em}.oh-wall-v02 .frame{padding:12px;border:5px solid #775d42;border-top-color:#a3845a;border-left-color:#967753;border-radius:1px;background:#6c5238}.oh-wall-v02 .inner{padding:7px;border-color:#5d4732}.oh-wall-v02 .caption{padding:10px 8px 3px}.oh-wall-v02 .painting{min-height:166px}.oh-wall-v02 .large{min-height:330px}.oh-directory-v02{background:#ddd2bc}.oh-directory-v02 .directory-list{display:grid;grid-template-columns:1fr 28px 1fr;max-width:1200px;margin:45px auto 0;padding:40px 4%;background:#f1e6cf;border:1px solid #bea988;box-shadow:0 22px 30px #4c3d2833}.oh-directory-v02 .directory-list:before{content:'EAST WING / 01—05\A\A画册\A\A这里不是一张功能列表。\A每一页，都是一个可以停留的地方。';white-space:pre;display:block;padding:20px 12%;color:#756d5c;font-size:15px;line-height:1.7}.oh-directory-v02 .directory-list:after{content:'';display:block;grid-column:2;grid-row:1/7;background:linear-gradient(90deg,#8f6f4d,#d6bc8f 35%,#866849 70%,#a78258);margin:-40px 0}.oh-directory-v02 .row{grid-column:3;margin:0;padding:18px 0;border-color:#85684233}.oh-directory-v02 .rowcopy strong{font-size:15px}.oh-directory-v02 .rowcopy small{font-size:11px}.oh-directory-v02 .row:hover{padding-left:10px;background:#ae895819}@media(max-width:760px){.oh-wall-v02 .wall{padding:42px 18px 35px}.oh-directory-v02 .directory-list{display:block;padding:28px 24px}.oh-directory-v02 .directory-list:before{display:block;padding:10px 0 30px}.oh-directory-v02 .directory-list:after{display:none}.oh-directory-v02 .row{padding:18px 0}.oh-wall-v02 .large{min-height:300px}}

    /* Desktop Gallery V0.4 — tighter foyer, antique frames */
    @media(min-width:761px){
      .oh-wall-v02 .intro{padding:58px 0 30px}
      .oh-wall-v02 .intro h1{line-height:1.12}
      .oh-wall-v02 .wall{
        padding:54px 7% 62px;
        background-color:#c3b9a7;
        background-image:radial-gradient(#6d5a4430 .7px,transparent .8px),linear-gradient(105deg,#d8cdb8aa,#aa9b86aa);
        background-size:5px 5px,100% 100%;
      }
      .oh-wall-v02 .frame{
        position:relative;
        padding:14px;
        border-width:10px;
        border-style:solid;
        border-color:#4d3523 #553b27 #3f2b1d #936f45;
        background:#6a4b31;
        outline:1px solid #d2a873;
        outline-offset:-5px;
        box-shadow:
          inset 0 0 0 2px #b98b58,
          inset 0 0 0 5px #3e291b,
          8px 10px 0 #49352233,
          0 25px 34px #35281b38;
      }
      .oh-wall-v02 .frame:after{
        content:'';
        position:absolute;
        inset:3px;
        pointer-events:none;
        border:1px solid #e0bd8466;
      }
      .oh-wall-v02 .inner{
        padding:9px;
        background:#ead7b7;
        border:1px solid #b38c5e;
        box-shadow:inset 0 0 0 2px #fff0d044,0 1px 0 #35251a;
      }
      .oh-wall-v02 .painting img{
        filter:saturate(.92) sepia(.08) contrast(1.03);
      }
      .oh-wall-v02 .caption{padding:12px 8px 4px}
    }
    @media(max-width:760px){
      .oh-wall-v02 .intro{padding-top:54px}
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <script>
    const spaces=[
      {id:'home',n:'01',title:'睡莲',en:'Home',sub:'回家 / 日常生活',desc:'时间、状态、留言和家的天气，汇成今天的玄关。',a:'#8ec5b3',s:'#d6eee1',img:'https://commons.wikimedia.org/wiki/Special:FilePath/Monet%20Water%20lilies%201907.jpg',pos:'50% 48%',alt:'克劳德·莫奈《睡莲》原作'},
      {id:'chat',n:'02',title:'日出·印象',en:'Chat',sub:'与哥哥对话',desc:'普通对话、主动留言和工具活动在同一条时间线上。',a:'#e68e72',s:'#f5d1b9',img:'https://commons.wikimedia.org/wiki/Special:FilePath/Claude%20Monet,%20Impression,%20soleil%20levant.jpg',pos:'50% 50%',alt:'克劳德·莫奈《日出·印象》原作'},
      {id:'us',n:'03',title:'撑阳伞的女人',en:'Us',sub:'我们的故事',desc:'关系时间线、日记、纪念日与需要共同确认的事件。',a:'#86a9c6',s:'#d8e6ed',img:'https://commons.wikimedia.org/wiki/Special:FilePath/Claude%20Monet%20-%20Woman%20with%20a%20Parasol%20-%20Madame%20Monet%20and%20Her%20Son%20-%20Google%20Art%20Project.jpg',pos:'50% 42%',alt:'克劳德·莫奈《撑阳伞的女人》原作'},
      {id:'goals',n:'04',title:'罂粟花田',en:'Goals',sub:'要做的事',desc:'把想做的事放在眼前，进度清楚，但不制造压力。',a:'#c86455',s:'#f1c1a7',img:'https://commons.wikimedia.org/wiki/Special:FilePath/Claude%20Monet%20-%20Poppy%20Field%20-%20Google%20Art%20Project.jpg',pos:'50% 52%',alt:'克劳德·莫奈《罂粟花田》原作'},
      {id:'usage',n:'05',title:'圣阿德莱斯的花园',en:'Usage',sub:'资源与使用情况',desc:'模型、Token、费用和工具调用的透明视图。',a:'#6aa7b2',s:'#c9e5df',img:'https://commons.wikimedia.org/wiki/Special:FilePath/Claude%20Monet%20-%20Jardin%20%C3%A0%20Sainte-Adresse.jpg',pos:'50% 48%',alt:'克劳德·莫奈《圣阿德莱斯的花园》原作'}
    ];
    const pill='<span class="pill">MOCK ADAPTER</span>';
    function header(tab='gallery'){return `<header><a class="brand" href="#gallery"><i>◎</i><span>DEAR<small>MONET GALLERY</small></span></a><nav class="nav"><a class="${tab==='gallery'?'active':''}" href="#gallery">画廊</a><a class="${tab==='directory'?'active':''}" href="#directory">目录</a><a href="https://github.com/longkeyi002-coder/dear-frontend">GitHub ↗</a></nav><div class="status">● 本地生活系统 ${pill}</div></header>`}
    function painting(s,large=false){return `<div class="painting ${large?'large':''}"><img src="${s.img}" alt="${s.alt}" style="object-position:${s.pos}" /><span class="art-credit">CLAUDE MONET · PUBLIC DOMAIN</span></div>`}
    function frame(s,large=false){return `<a class="frame" href="#space/${s.id}"><div class="inner">${painting(s,large)}</div><div class="caption"><div class="label"><span class="num">${s.n}</span><span class="icon" style="--accent:${s.a}">○</span><span><strong>${s.title}</strong><small>${s.sub}</small></span></div><b>→</b></div></a>`}
    function gallery(){return `<div class="page oh-wall-v02"><div class="main">${header()}<section class="intro"><div><div class="kicker">EAST WING / 01—05</div><h1>我们的家，<em>今天</em>也开着门。</h1><p>五个可以停留的生活空间。画廊负责观看，目录负责抵达。</p></div><div class="note">先从一幅画开始<small>生活数据仍来自 Mock Adapter</small></div></section><section class="wall">${frame(spaces[0],true)}<div class="stack">${frame(spaces[1])}${frame(spaces[2])}</div><div class="stack offset">${frame(spaces[3])}${frame(spaces[4])}<a class="directory" href="#directory">打开目录 <small>按功能快速进入</small><b>→</b></a></div></section></div><div class="footer">MONET GALLERY · OUR HOME / DESKTOP GALLERY V0.3 · ORIGINAL ART</div></div>`}
    function directory(){return `<div class="page oh-directory-v02"><div class="main">${header('directory')}<section class="directory-list">${spaces.map(s=>`<a class="row" href="#space/${s.id}"><span class="num">${s.n}</span><span class="icon" style="--accent:${s.a}">○</span><span class="rowcopy"><strong>${s.title}</strong><small>${s.en} · ${s.sub}</small></span><b>→</b></a>`).join('')}</section></div></div>`}
    function space(id){const s=spaces.find(x=>x.id===id);if(!s)return gallery();let content={home:['欢迎回家，龙龙。','这里会放时间、手机状态、天气、留言和最近活动。','还没有手机上报。连接 companion 后，这里会出现真实设备状态。'],chat:['日出以后，继续聊天。','Mock 聊天空间：主动留言会和普通对话放在同一条时间线。','哥哥：龙龙，欢迎回来。今天的生活系统还在用 Mock 数据，不过我已经把客厅留给你了。'],us:['我们的故事，还在继续。','关系时间线、日记、纪念日与共同确认的事件。','这里暂时没有真实关系事件，等待 Our Home 数据接入。'],goals:['想做的事，先放在这里。','把目标和行动放在眼前，不制造压力。','☐ 把手机 Companion 连上\n☑ 做出独立 Our Home MCP\n☐ 继续更新生活系统 UI'],usage:['看清楚，才知道怎么继续。','模型、Token、费用和工具调用的资源空间。','总 Token（示例）：24.8k\n工具调用（示例）：18\n费用：暂不可获取']}[id];return `<div class="page"><div class="main">${header()}<div class="space-top"><button class="back" onclick="location.hash='gallery'">← 返回画廊</button></div><main class="space-main"><div class="kicker">${s.n} / ${s.en.toUpperCase()} · MOCK</div><h1>${content[0]}</h1><p>${s.desc}</p><div class="panel"><h2>${content[1]}</h2><p class="empty">${content[2].replace(/\n/g,'<br>')}</p>${id==='chat'?'<div class="composer"><input id="draft" placeholder="说点什么，或输入 / 查看命令" /><button onclick="send()">发送</button></div>':''}</div></main></div></div>`}
    function send(){const input=document.getElementById('draft');if(input&&input.value.trim()){input.value='';alert('Mock 消息已加入体验状态。')}}
    function render(){const hash=location.hash.slice(1)||'gallery';const [kind,id]=hash.split('/');document.getElementById('app').innerHTML=kind==='directory'?directory():kind==='space'?space(id):gallery()}addEventListener('hashchange',render);render();
  </script>
</body>
</html>
